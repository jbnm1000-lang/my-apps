    t.innerText = msg;
    t.style.backgroundColor = isWarning ? "#ef4444" : "#10b981";
    t.className = "mbti-toast show";
    setTimeout(() => { t.className = t.className.replace("show", ""); }, 3000);
}

function executeAnalysis() {
    const um = document.getElementById("userMbti").value;
    const tm = document.getElementById("targetMbti").value;
    const sit = document.getElementById("situation").value;

    if(!um || !tm || !sit) {
        showToast("모든 항목(1, 2, 3번)을 반드시 선택해 주세요!", true);
        return;
    }
    
    // 수익화 극대화 핵심: URL 파라미터 기반 새로고침
    const q = `?launch=1&um=${um}&tm=${tm}&sit=${sit}`;
    window.location.href = window.location.pathname + q;
}

function runEngineFromUrl() {
    const params = new URLSearchParams(window.location.search);
    if(params.get("launch") === "1") {
        document.getElementById("mbti-input-area").style.display = "none";
        document.getElementById("mbti-result-area").style.display = "block";

        const um = params.get("um");
        const tm = params.get("tm");
        const sit = params.get("sit");

        const uData = mbtiData[um];
        const tData = mbtiData[tm];
        const sData = sitData[sit];

        // 글자 깨짐 방지: 직접 HTML 태그 활용
        document.getElementById("res-summary").innerHTML = `당신은 <b>[${um}]</b> 성향으로 ${uData.trait} 반면, 상대방은 <b>[${tm}]</b> 성향으로 ${tData.trait} 현재 직면한 [${sData}]`;
        
        document.getElementById("res-action").innerHTML = `1. 먼저 당신의 본래 성향인 '${um}의 방식'을 잠시 내려놓고, 철저히 상대방의 주파수에 맞추십시오.<br><br>2. 상대방을 대할 때는 ${tData.action}<br><br>3. 당신의 의도를 전달할 때는 상황의 특성에 맞게 논리 구조를 짜서 접근해야 합니다.`;
        
        document.getElementById("res-warning").innerHTML = `상대방(${tm})의 방어기제를 폭발시키고 관계를 돌이킬 수 없게 만드는 치명적인 행동입니다:<br><br><b>🚨 ${tData.avoid}</b><br><br>이 상황에서는 절대로 위와 같은 행동 패턴을 보여서는 안 됩니다.`;
        
        document.getElementById("res-magic").innerHTML = `<b>" ${tData.magic} "</b><br><br><span style="font-size:0.85em; color:#94a3b8;">(이 멘트를 자연스럽게 대화의 도입부나 마무리에 사용하여 상대의 경계를 해제하십시오.)</span>`;

        window.scrollTo({top: document.querySelector('.mbti-container').offsetTop - 20, behavior: 'smooth'});
    }
}

function copyResult() {
    const text = `💡 관계 요약:\n${document.getElementById("res-summary").innerText}\n\n✅ 대처법:\n${document.getElementById("res-action").innerText}\n\n🚫 금기 행동:\n${document.getElementById("res-warning").innerText}\n\n✨ 마법의 멘트:\n${document.getElementById("res-magic").innerText}`;
    
    const el = document.createElement("textarea");
    el.value = text;
    document.body.appendChild(el);
    el.select();
    document.execCommand("copy");
    document.body.removeChild(el);
    showToast("분석 결과가 복사되었습니다. 카카오톡이나 메모장에 공유해 보세요!", false);
}

function resetEngine() { window.location.href = window.location.pathname; }

document.addEventListener("DOMContentLoaded", runEngineFromUrl);
//]]>
</script>
