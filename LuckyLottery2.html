  <br />

  <div style="background-color: #e3f2fd; border-left: 5px solid rgb(116, 185, 255); border-radius: 12px; box-shadow: rgba(0, 0, 0, 0.05) 0px 4px 6px; margin-bottom: 20px; padding: 18px; text-align: left;">

    <p style="color: #2d3436; font-size: 14px; line-height: 1.6; margin: 0px; word-break: keep-all;">

  <div style="background-color: white; border-radius: 15px; border: 1px dashed rgb(52, 152, 219); box-shadow: rgba(0, 0, 0, 0.05) 0px 2px 8px; margin-bottom: 25px; padding: 20px;">
    <p style="color: #495057; font-size: 14px; line-height: 1.8; margin: 0px; text-align: left; word-break: keep-all;">

      미리 정해두고 싶은 특정 조나 숫자가 있다면 아래 칸에서 선택해 주세요. <b>'자동'</b>으로 남겨둔 칸은 행운의 무작위 숫자로 예쁘게 채워드립니다.

  <p style="color: #2980b9; font-size: 15px; font-weight: bold; margin-bottom: 10px; text-align: left;">🎯 원하는 자리 콕콕 고르기 (선택 사항)</p>
  
  <div style="background: rgb(255, 255, 255); border-radius: 15px; border: 2px solid rgb(179, 229, 252); box-shadow: rgba(0, 0, 0, 0.05) 0px 2px 5px inset; margin-bottom: 25px; padding: 15px 10px;">
    
    <div style="margin-bottom: 12px; text-align: center;">
      <span style="color: #576574; font-size: 13px; font-weight: bold; margin-right: 8px;">몇 조?</span>
      <select id="setJo" style="border-radius: 8px; border: 2px solid rgb(52, 152, 219); color: #2980b9; cursor: pointer; font-size: 14px; font-weight: bold; outline: none; padding: 6px 12px;"></select>

    <div style="background: rgb(223, 230, 233); height: 2px; margin: 0px 5px 12px;"></div>

      <div style="flex: 1 1 0%; text-align: center;">
        <span style="color: #576574; display: block; font-size: 10px; margin-bottom: 4px;">만</span>
        <select class="digit-sel" id="d2" style="border-radius: 6px; border: 2px solid rgb(189, 195, 199); cursor: pointer; font-size: 12px; font-weight: bold; outline: none; padding: 6px 0px; text-align: center; width: 100%;"></select>
      </div>
      <div style="flex: 1 1 0%; text-align: center;">
        <span style="color: #576574; display: block; font-size: 10px; margin-bottom: 4px;">천</span>
        <select class="digit-sel" id="d3" style="border-radius: 6px; border: 2px solid rgb(189, 195, 199); cursor: pointer; font-size: 12px; font-weight: bold; outline: none; padding: 6px 0px; text-align: center; width: 100%;"></select>

        <span style="color: #576574; display: block; font-size: 10px; margin-bottom: 4px;">백</span>
        <select class="digit-sel" id="d4" style="border-radius: 6px; border: 2px solid rgb(189, 195, 199); cursor: pointer; font-size: 12px; font-weight: bold; outline: none; padding: 6px 0px; text-align: center; width: 100%;"></select>
      </div>
      <div style="flex: 1 1 0%; text-align: center;">
        <span style="color: #576574; display: block; font-size: 10px; margin-bottom: 4px;">십</span>
        <select class="digit-sel" id="d5" style="border-radius: 6px; border: 2px solid rgb(189, 195, 199); cursor: pointer; font-size: 12px; font-weight: bold; outline: none; padding: 6px 0px; text-align: center; width: 100%;"></select>
      </div>
      <div style="flex: 1 1 0%; text-align: center;">
        <span style="color: #576574; display: block; font-size: 10px; margin-bottom: 4px;">일</span>
        <select class="digit-sel" id="d6" style="border-radius: 6px; border: 2px solid rgb(189, 195, 199); cursor: pointer; font-size: 12px; font-weight: bold; outline: none; padding: 6px 0px; text-align: center; width: 100%;"></select>

  <p style="color: #2980b9; font-size: 15px; font-weight: bold; margin-bottom: 10px; text-align: left;">✨ 행운의 추첨 결과</p>
  <div id="winLotNumberBox" style="align-items: center; background-color: white; border-radius: 15px; border: 3px solid rgb(52, 152, 219); box-shadow: rgba(52, 152, 219, 0.15) 0px 4px 10px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 15px; min-height: 90px; padding: 20px 10px;"></div>

  <button onclick="copyWinLotNumbers()" style="background-color: #bdc3c7; border-color: currentcolor; border-image: initial; border-radius: 10px; border-style: none; border-width: medium; border: none; box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 5px; color: white; cursor: pointer; font-size: 15px; font-weight: bold; margin-bottom: 25px; padding: 12px; width: 100%;">
    결과 복사하기 📋
  </button>

  <button onclick="generateWinLotRoute()" onmouseout="this.style.transform='scale(1)'" onmouseover="this.style.transform='scale(1.03)'" style="background: linear-gradient(135deg, rgb(0, 168, 255), rgb(52, 152, 219), rgb(41, 128, 185)); border-color: currentcolor; border-image: initial; border-radius: 15px; border-style: none; border-width: medium; border: none; box-shadow: rgba(41, 128, 185, 0.4) 0px 6px 15px; color: white; cursor: pointer; font-size: 22px; font-weight: 900; padding: 18px 30px; text-shadow: rgba(0, 0, 0, 0.2) 1px 1px 2px; transition: 0.2s; width: 100%;">
    연금 번호 섞기 🎯
  </button>

<script>
  let currentResultText = "";

  const joSel = document.getElementById("setJo");
  joSel.innerHTML = "<option value='auto'>자동</option>";
  for(let i=1; i<=5; i++) joSel.innerHTML += `<option value='${i}'>${i}조</option>`;

  const digitSels = document.querySelectorAll(".digit-sel");
  digitSels.forEach(sel => {
    sel.innerHTML = "<option value='auto'>자동</option>";
    for(let i=0; i<=9; i++) sel.innerHTML += `<option value='${i}'>${i}</option>`;
  });

  function getWinLotParam(name) {
    const urlParams = new URLSearchParams(window.location.search);
    return urlParams.get(name);
  }

  function generateWinLotRoute() {
    const currentUrl = window.location.origin + window.location.pathname;
    const randomTrigger = Math.floor(Math.random() * 100000);
    
    const joVal = document.getElementById("setJo").value;
    const d1 = document.getElementById("d1").value;
    const d2 = document.getElementById("d2").value;
    const d3 = document.getElementById("d3").value;
    const d4 = document.getElementById("d4").value;
    const d5 = document.getElementById("d5").value;
    const d6 = document.getElementById("d6").value;
    const digitsStr = [d1, d2, d3, d4, d5, d6].join(",");

    window.location.href = currentUrl + "?winlot_draw=" + randomTrigger + "&jo=" + joVal + "&digits=" + digitsStr;
  }

  function copyWinLotNumbers() {
    if (!currentResultText) {
      alert("먼저 [연금 번호 섞기] 버튼을 눌러 번호를 뽑아주세요!");
      return;
    }
    const tempInput = document.createElement("textarea");
    tempInput.value = currentResultText;
    document.body.appendChild(tempInput);
    tempInput.select();
    document.execCommand("copy");
    document.body.removeChild(tempInput);
    alert("번호가 복사되었습니다! 카카오톡이나 메모장에 붙여넣기 해보세요.");
  }

  window.addEventListener('DOMContentLoaded', () => {
    const winLotBox = document.getElementById("winLotNumberBox");
    const isDrawed = getWinLotParam("winlot_draw");
    const joParam = getWinLotParam("jo");
    const digitsParam = getWinLotParam("digits");

    if (joParam) document.getElementById("setJo").value = joParam;
    if (digitsParam) {
      const dArr = digitsParam.split(",");
      for(let i=1; i<=6; i++) {
        document.getElementById("d" + i).value = dArr[i-1];
      }
    }

    if (!isDrawed) {
      winLotBox.innerHTML = "<p style='color: #b2bec3; font-size: 16px; font-weight: bold; margin: 0px;'>번호를 세팅하고 아래 버튼을 눌러주세요!</p>";
      return;
    }

    winLotBox.innerHTML = "";

    let finalJo = (joParam && joParam !== "auto") ? joParam : Math.floor(Math.random() * 5) + 1;
    const joBall = document.createElement("div");
    joBall.style.cssText = "width:55px; height:48px; border-radius:10px; background:#7f8fa6; color:white; display:flex; justify-content:center; align-items:center; font-size:18px; font-weight:900; box-shadow:0 4px 8px rgba(0,0,0,0.2); margin-right:12px; border: 2px solid rgba(255,255,255,0.5);";
    joBall.innerText = finalJo + "조";
    winLotBox.appendChild(joBall);

    const colorTable = ["#e84118", "#ff9f43", "#fbc531", "#4cd137", "#00a8ff", "#9c88ff"];
    const paramDigits = digitsParam ? digitsParam.split(",") : ["auto","auto","auto","auto","auto","auto"];
    
    let finalDigitsArray = [];

    for (let i = 0; i < 6; i++) {
      let finalDigit = (paramDigits[i] && paramDigits[i] !== "auto") ? paramDigits[i] : Math.floor(Math.random() * 10);
      finalDigitsArray.push(finalDigit);

      const digitBall = document.createElement("div");
      digitBall.style.cssText = "width:48px; height:48px; border-radius:50%; background:" + colorTable[i] + "; color:white; display:flex; justify-content:center; align-items:center; font-size:22px; font-weight:900; box-shadow:0 4px 8px rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.5);";
      digitBall.innerText = finalDigit;
      winLotBox.appendChild(digitBall);
    }

    currentResultText = "[💎 매달 든든한 연금복권]\n" + finalJo + "조 " + finalDigitsArray.join(" ");
  });
</script>
